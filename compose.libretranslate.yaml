# Optional layer that adds a free, self-hosted LibreTranslate service and
# switches every worker to try it first - no API key, no billing, no daily
# quota, since translation runs in your own container instead of a metered
# third-party API. Works completely standalone:
#
#   docker compose -f compose.yaml -f compose.libretranslate.yaml up --build -d
#
# First boot downloads language models and can take several minutes. Watch
# progress with:
#   docker compose -f compose.yaml -f compose.libretranslate.yaml logs -f libretranslate
# and check what actually loaded once it's healthy:
#   curl http://localhost:5001/languages
#
# Coverage of all 9 ASEAN-set languages isn't guaranteed - Argos Translate
# (the engine behind LibreTranslate) is community-trained. Confirmed NOT in
# its catalog: Burmese (my), Khmer (km), Lao (lo) - LT_LOAD_ONLY below
# deliberately excludes them, since LibreTranslate 1.9.6 aborts loading its
# *entire* language set if even one requested code is unavailable (not just
# skipping the bad ones), which otherwise crashes the container on every
# boot. Those three always need the Gemini fallback (export GEMINI_API_KEY)
# - there is no free/self-hosted path for them here. Each worker still
# discovers real coverage at runtime by querying LibreTranslate's
# /languages endpoint - no other hardcoded assumptions about which of the
# remaining 6 it has.
#
# Optional Gemini fallback for whatever LibreTranslate doesn't cover: just
# export GEMINI_API_KEY before running the same command above (no need to
# also add compose.real.yaml - this file already wires GEMINI_API_KEY
# through if it's set, and TRANSLATION_BACKEND=auto below means "prefer
# LibreTranslate, fall back to Gemini" rather than "only ever use
# LibreTranslate"). Set TRANSLATION_BACKEND=libretranslate instead (in your
# shell, before this command) if you want free-only with no fallback at all.
x-free-worker: &free-worker
  image: polyglot-relay:translate
  build:
    context: .
    target: translate
  environment:
    TRANSLATION_BACKEND: ${TRANSLATION_BACKEND:-auto}
    LIBRETRANSLATE_URL: http://libretranslate:5000
    GEMINI_API_KEY: ${GEMINI_API_KEY:-insert your key}
    # Left unset by default (matching compose.real.yaml) so Translator.__init__'s
    # own GEMINI_TIER-based default applies (gemini-pro-latest on paid,
    # gemini-3.6-flash on free) instead of always pinning gemini-3.7-flash -
    # confirmed on a real billing-enabled key that 3.7-flash's paid-tier quota
    # grant can lag behind other models (see GEMINI_TIER note in .env.example),
    # while pro-latest/flash-latest already reflect the paid tier correctly.
    GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-}
    # Only my/km/lo ever reach Gemini here (the other 6 stay on
    # LibreTranslate), but this overlay previously never passed GEMINI_TIER
    # through at all, so Translator.__init__ silently defaulted to "paid"
    # while the key it was tested with was still genuinely free-tier -
    # tripping the same 20/day cap this overlay exists to avoid. Defaults to
    # "paid" here since billing was confirmed active on the project this was
    # built against (Cloud Console: linked billing account, Pro-tier access
    # working); override to "free" in your shell if testing against a key
    # that isn't billing-enabled.
    GEMINI_TIER: ${GEMINI_TIER:-paid}
    # Also unwired before now: on paid tier this defaults to 0 (no stagger),
    # which assumes the RPM ceiling absorbs a simultaneous burst - didn't
    # hold up in practice for the 3 Gemini-dependent workers here (my/km/lo
    # hitting the same model in the same instant tripped a FreeTier-labeled
    # 429 that an isolated call never did). Passed through so a nonzero
    # override in .env actually reaches the containers.
    POLYGLOT_STAGGER_STEP_SECONDS: ${POLYGLOT_STAGGER_STEP_SECONDS:-}
    # Also unwired before now: default is 5 retries with growing backoff
    # (up to ~60s each), which can block a worker's queue for minutes on a
    # genuinely exhausted shared quota - failing faster lets the next,
    # fresher chunk get a turn instead of queuing behind a doomed retry.
    GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-}
    # Optional per-language key overrides: my/km/lo currently all draw on
    # the single GEMINI_API_KEY above, so their daily quotas are one shared
    # pool - the actual root cause of the contention documented above. Set
    # these (each to a separate Google AI Studio key/project) to give each
    # language its own independent quota instead. Harmless no-op on the
    # other 6 workers, which never call Gemini at all.
    GEMINI_API_KEY_MY: ${GEMINI_API_KEY_MY:-}
    GEMINI_API_KEY_KM: ${GEMINI_API_KEY_KM:-}
    GEMINI_API_KEY_LO: ${GEMINI_API_KEY_LO:-}

services:
  demo-producer:
    profiles: [demo]

  # Never wired to Gemini at all in this overlay before now: the dashboard's
  # own audio upload/record endpoint (web_ui.py -> stt_service.transcribe_file)
  # runs in this container, and its Gemini STT fallback for my/km/lo (see
  # stt_service.py) silently found no API key and fell straight back to
  # plain Whisper - reproducing the exact same garbled-transcription bug the
  # fallback exists to fix, regardless of which language was selected in the
  # dashboard. Only *adds* to the ui service's environment (the base
  # compose.yaml entry keeps its own broker-address vars); Compose merges
  # environment maps across files rather than replacing them.
  ui:
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_MY: ${GEMINI_API_KEY_MY:-}
      GEMINI_API_KEY_KM: ${GEMINI_API_KEY_KM:-}
      GEMINI_API_KEY_LO: ${GEMINI_API_KEY_LO:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-}
      GEMINI_STT_MODEL: ${GEMINI_STT_MODEL:-}
      # The dashboard translates Burmese/Khmer/Lao captions to English once
      # (see POLYGLOT_PIVOT), so it needs the same tier-aware Gemini settings.
      GEMINI_TIER: ${GEMINI_TIER:-paid}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-}
      POLYGLOT_PIVOT: ${POLYGLOT_PIVOT:-}
      POLYGLOT_PIVOT_TIMEOUT: ${POLYGLOT_PIVOT_TIMEOUT:-}
      # Live captions (see .env.example). Empty means the built-in default.
      GEMINI_STT_MAX_RETRIES: ${GEMINI_STT_MAX_RETRIES:-}
      POLYGLOT_LIVE_WORKERS: ${POLYGLOT_LIVE_WORKERS:-}
      POLYGLOT_LIVE_MAX_HOLD_SECONDS: ${POLYGLOT_LIVE_MAX_HOLD_SECONDS:-}
      POLYGLOT_LIVE_MIN_SLICE_SECONDS: ${POLYGLOT_LIVE_MIN_SLICE_SECONDS:-}
      POLYGLOT_LIVE_MAX_SLICE_SECONDS: ${POLYGLOT_LIVE_MAX_SLICE_SECONDS:-}
      POLYGLOT_LIVE_PAUSE_MS: ${POLYGLOT_LIVE_PAUSE_MS:-}
      # The dashboard skips the shared English rendering when every language goes
      # straight to Gemini, so it needs to know the backend the workers use.
      TRANSLATION_BACKEND: ${TRANSLATION_BACKEND:-auto}
      # Public use: a shared secret every change request must carry (viewing stays
      # open), a per-address request limit, and Whisper start-up / silence handling.
      POLYGLOT_ACCESS_TOKEN: ${POLYGLOT_ACCESS_TOKEN:-}
      POLYGLOT_RATE_LIMIT_PER_MINUTE: ${POLYGLOT_RATE_LIMIT_PER_MINUTE:-}
      POLYGLOT_PRELOAD_WHISPER: ${POLYGLOT_PRELOAD_WHISPER:-}
      POLYGLOT_MIN_WINDOW_SECONDS: ${POLYGLOT_MIN_WINDOW_SECONDS:-}
      POLYGLOT_SILENCE_PEAK: ${POLYGLOT_SILENCE_PEAK:-}
      POLYGLOT_GEMINI_STT_LANGUAGES: ${POLYGLOT_GEMINI_STT_LANGUAGES:-}
      POLYGLOT_HISTORY_CHUNKS: ${POLYGLOT_HISTORY_CHUNKS:-}
      POLYGLOT_HISTORY_MINUTES: ${POLYGLOT_HISTORY_MINUTES:-}
      POLYGLOT_VIEW_TOKEN: ${POLYGLOT_VIEW_TOKEN:-}
      POLYGLOT_HISTORY_FILE: ${POLYGLOT_HISTORY_FILE:-}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-}
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-}

  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:
      LT_LOAD_ONLY: en,id,ms,th,vi,tl
    volumes:
      - lt-models:/home/libretranslate/.local
    networks: [relay]
    # Loopback only: this service has no authentication, so it must not be reachable from the network.
    ports: ["127.0.0.1:5001:5000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 300s

  worker-en-1:
    <<: *free-worker
    command: ["python", "translator_worker.py", "--lang", "en", "--host", "auto", "--port", "8100"]

  worker-en-2:
    <<: *free-worker
    command: ["python", "translator_worker.py", "--lang", "en", "--host", "auto", "--port", "8100"]

  worker-my:
    <<: *free-worker
    command: ["python", "translator_worker.py", "--lang", "my", "--host", "auto", "--port", "8100"]

  worker-id:
    <<: *free-worker
    command: ["python", "translator_worker.py", "--lang", "id", "--host", "auto", "--port", "8100"]

  worker-ms:
    <<: *free-worker
    command: ["python", "translator_worker.py", "--lang", "ms", "--host", "auto", "--port", "8100"]

  worker-th:
    <<: *free-worker
    command: ["python", "translator_worker.py", "--lang", "th", "--host", "auto", "--port", "8100"]

  worker-vi:
    <<: *free-worker
    command: ["python", "translator_worker.py", "--lang", "vi", "--host", "auto", "--port", "8100"]

  worker-tl:
    <<: *free-worker
    command: ["python", "translator_worker.py", "--lang", "tl", "--host", "auto", "--port", "8100"]

  worker-km:
    <<: *free-worker
    command: ["python", "translator_worker.py", "--lang", "km", "--host", "auto", "--port", "8100"]

  worker-lo:
    <<: *free-worker
    command: ["python", "translator_worker.py", "--lang", "lo", "--host", "auto", "--port", "8100"]

volumes:
  lt-models:
