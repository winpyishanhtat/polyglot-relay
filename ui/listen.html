<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FFEEC8">
    <title>Polyglot Relay — Live captions</title>
    <meta name="description" content="Follow what is being said in several languages at once, on your own phone or screen.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
  </head>
  <body class="listen-page">
    <header class="listen-bar">
      <a class="listen-home" href="/">Polyglot Relay</a>
      <span id="listen-state" class="network-pill"><i></i><span>Connecting</span></span>
    </header>

    <main class="listen-main">
      <!-- Shown only when the scripts did not load, e.g. this file opened from disk instead of through the relay. -->
      <section id="listen-fallback" style="font-family: system-ui, sans-serif; max-width: 34em; margin: 12vh auto; padding: 0 16px">
        <h1>This page needs the relay</h1>
        <p>It cannot run from a file on disk. Start the relay, then open
          <a href="http://localhost:8000/listen">http://localhost:8000/listen</a>.</p>
      </section>

      <section id="listen-view" hidden>
        <div class="listen-head">
          <h1>Live captions</h1>
          <div class="listen-tools">
            <button type="button" class="button secondary" id="listen-smaller" aria-label="Smaller text">A−</button>
            <button type="button" class="button secondary" id="listen-larger" aria-label="Larger text">A+</button>
            <select id="listen-read-lang" aria-label="Language to read aloud" hidden></select>
            <button type="button" class="button primary" id="listen-speak" aria-pressed="false">Read aloud</button>
          </div>
        </div>
        <div class="listen-chips-row">
          <span class="group-label">Languages</span>
          <div id="listen-chips" class="history-langs" role="group" aria-label="Languages to show"></div>
        </div>
        <p id="listen-note" class="listen-note" role="status"></p>
        <div id="listen-latest" class="listen-latest" role="log" aria-live="polite"><p class="empty">Waiting for the first caption…</p></div>
        <h2 id="listen-earlier-heading" class="listen-earlier-heading" hidden>Earlier</h2>
        <div id="listen-earlier" class="listen-earlier"></div>
      </section>
    </main>

    <script src="/speech.js" defer></script>
    <script src="/listen.js" defer></script>
  </body>
</html>
