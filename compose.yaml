name: polyglot-relay

x-common-environment: &common-environment
  POLYGLOT_BROKER_1_HOST: broker-1
  POLYGLOT_BROKER_1_PORT: "7001"
  POLYGLOT_BROKER_2_HOST: broker-2
  POLYGLOT_BROKER_2_PORT: "7002"
  POLYGLOT_BROKER_3_HOST: broker-3
  POLYGLOT_BROKER_3_PORT: "7003"
  # Three replicas: the cluster keeps working after losing two of them in turn.
  POLYGLOT_BROKER_COUNT: "3"
  POLYGLOT_BROKER_BIND_HOST: 0.0.0.0
  POLYGLOT_WORKER_BIND_HOST: 0.0.0.0
  # Delivery tuning (empty = the built-in default; see README, "Delivery guarantees").
  POLYGLOT_JOB_TIMEOUT: ${POLYGLOT_JOB_TIMEOUT:-}
  POLYGLOT_MAX_DELIVERY_ATTEMPTS: ${POLYGLOT_MAX_DELIVERY_ATTEMPTS:-}
  POLYGLOT_WAITING_MAX_AGE: ${POLYGLOT_WAITING_MAX_AGE:-}
  POLYGLOT_REPLICATION_INTERVAL: ${POLYGLOT_REPLICATION_INTERVAL:-}
  POLYGLOT_REPLAY_DELAY: ${POLYGLOT_REPLAY_DELAY:-}
  POLYGLOT_TRANSLATION_CACHE: ${POLYGLOT_TRANSLATION_CACHE:-}
  # A shared secret every broker, worker, dashboard and listener must prove before it is listened to.
  POLYGLOT_CLUSTER_SECRET: ${POLYGLOT_CLUSTER_SECRET:-}
  # Leader election: bully (default) or raft (majority votes: never two leaders, needs 2 of 3 brokers up).
  POLYGLOT_ELECTION: ${POLYGLOT_ELECTION:-}
  POLYGLOT_RAFT_STATE: ${POLYGLOT_RAFT_STATE:-/data/raft-{id}.json}
  # Unfinished jobs on each broker's disk, so they survive every broker restarting at once ("" turns it off).
  POLYGLOT_JOB_JOURNAL: ${POLYGLOT_JOB_JOURNAL-/data/jobs-{id}.db}
  POLYGLOT_JOB_JOURNAL_MAX_AGE: ${POLYGLOT_JOB_JOURNAL_MAX_AGE:-}
  # Names and terms rendered the same way everywhere (a JSON file inside the containers; see README).
  POLYGLOT_GLOSSARY_FILE: ${POLYGLOT_GLOSSARY_FILE:-}
  # Drop transcripts invented for silence or music ("Thanks for watching!"); 0 turns it off.
  POLYGLOT_FRAGMENT_GUARD: ${POLYGLOT_FRAGMENT_GUARD:-}

x-app: &app
  image: polyglot-relay:mock
  environment:
    <<: *common-environment
  networks: [relay]
  restart: unless-stopped

x-worker-dependencies: &worker-dependencies
  broker-1:
    condition: service_healthy
  broker-2:
    condition: service_healthy
  broker-3:
    condition: service_healthy

services:
  broker-1:
    <<: *app
    build:
      context: .
      target: mock
    command: ["python", "broker.py", "--id", "1"]
    # Loopback only: the broker protocol has no authentication. Anyone who can reach it can
    # register as a worker and write captions on every viewer's screen.
    ports: ["127.0.0.1:7001:7001"]
    volumes: ["broker-data:/data"]          # job journal and election state, one file per broker
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "--port", "7001"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  broker-2:
    <<: *app
    command: ["python", "broker.py", "--id", "2"]
    ports: ["127.0.0.1:7002:7002"]
    volumes: ["broker-data:/data"]          # job journal and election state, one file per broker
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "--port", "7002"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  broker-3:
    <<: *app
    command: ["python", "broker.py", "--id", "3"]
    ports: ["127.0.0.1:7003:7003"]
    volumes: ["broker-data:/data"]          # job journal and election state, one file per broker
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "--port", "7003"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  # English runs as a 2-replica pool to demonstrate round-robin load
  # balancing across independent worker containers (real parallel
  # processes, not threads in one process). Every other language runs a
  # single replica by default -- scale any of them the same way, e.g.:
  #   docker compose up --scale worker-th=3
  worker-en-1:
    <<: *app
    command: ["python", "translator_worker.py", "--lang", "en", "--mock", "--host", "auto", "--port", "8100"]
    depends_on: *worker-dependencies

  worker-en-2:
    <<: *app
    command: ["python", "translator_worker.py", "--lang", "en", "--mock", "--host", "auto", "--port", "8100"]
    depends_on: *worker-dependencies

  worker-my:
    <<: *app
    command: ["python", "translator_worker.py", "--lang", "my", "--mock", "--host", "auto", "--port", "8100"]
    depends_on: *worker-dependencies

  worker-id:
    <<: *app
    command: ["python", "translator_worker.py", "--lang", "id", "--mock", "--host", "auto", "--port", "8100"]
    depends_on: *worker-dependencies

  worker-ms:
    <<: *app
    command: ["python", "translator_worker.py", "--lang", "ms", "--mock", "--host", "auto", "--port", "8100"]
    depends_on: *worker-dependencies

  worker-th:
    <<: *app
    command: ["python", "translator_worker.py", "--lang", "th", "--mock", "--host", "auto", "--port", "8100"]
    depends_on: *worker-dependencies

  worker-vi:
    <<: *app
    command: ["python", "translator_worker.py", "--lang", "vi", "--mock", "--host", "auto", "--port", "8100"]
    depends_on: *worker-dependencies

  worker-tl:
    <<: *app
    command: ["python", "translator_worker.py", "--lang", "tl", "--mock", "--host", "auto", "--port", "8100"]
    depends_on: *worker-dependencies

  worker-km:
    <<: *app
    command: ["python", "translator_worker.py", "--lang", "km", "--mock", "--host", "auto", "--port", "8100"]
    depends_on: *worker-dependencies

  worker-lo:
    <<: *app
    command: ["python", "translator_worker.py", "--lang", "lo", "--mock", "--host", "auto", "--port", "8100"]
    depends_on: *worker-dependencies

  listener-en:
    <<: *app
    profiles: [console]
    command: ["python", "listener_client.py", "--lang", "en"]
    depends_on: [worker-en-1, worker-en-2]

  listener-my:
    <<: *app
    profiles: [console]
    command: ["python", "listener_client.py", "--lang", "my"]
    depends_on: [worker-my]

  demo-producer:
    <<: *app
    profiles: [demo]
    command: ["python", "stt_service.py", "--demo", "--demo-interval", "3"]
    depends_on:
      worker-en-1:
        condition: service_started
      worker-en-2:
        condition: service_started
      worker-my:
        condition: service_started
      worker-id:
        condition: service_started
      worker-ms:
        condition: service_started
      worker-th:
        condition: service_started
      worker-vi:
        condition: service_started
      worker-tl:
        condition: service_started
      worker-km:
        condition: service_started
      worker-lo:
        condition: service_started

  ui:
    <<: *app
    # Needs Whisper/ffmpeg to transcribe uploaded/recorded audio in-browser
    # captions server-side (see web_ui.py's /api/captions/audio) - the
    # "mock"/"translate" images don't have those, so this overrides the
    # shared *app anchor's image/build to the heavier "full" target instead.
    image: polyglot-relay:full
    build:
      context: .
      target: full
    command: ["python", "web_ui.py", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *common-environment
      # Keep the history across restarts (SQLite, e.g. /data/history.db), and the access and viewing tokens.
      POLYGLOT_HISTORY_FILE: ${POLYGLOT_HISTORY_FILE:-}
      POLYGLOT_ACCESS_TOKEN: ${POLYGLOT_ACCESS_TOKEN:-}
      POLYGLOT_VIEW_TOKEN: ${POLYGLOT_VIEW_TOKEN:-}
      # Rooms, push updates and translation context (see README).
      POLYGLOT_MAX_ROOMS: ${POLYGLOT_MAX_ROOMS:-}
      POLYGLOT_CONTEXT_SENTENCES: ${POLYGLOT_CONTEXT_SENTENCES:-}
      POLYGLOT_HISTORY_DB_ROWS: ${POLYGLOT_HISTORY_DB_ROWS:-}
      # Words while the speaker is still talking (costs a transcription every couple of seconds).
      POLYGLOT_INTERIM: ${POLYGLOT_INTERIM:-}
      # Read-aloud: clips kept on disk, and the daily allowance per speech model.
      POLYGLOT_TTS_CACHE_DIR: ${POLYGLOT_TTS_CACHE_DIR:-/data/tts}
      POLYGLOT_TTS_CACHE_MB: ${POLYGLOT_TTS_CACHE_MB:-}
      POLYGLOT_TTS_DAILY_LIMIT: ${POLYGLOT_TTS_DAILY_LIMIT:-}
    # Host port 8000, not 8080: 8080 is commonly already bound by other
    # local software (e.g. another web server) on Windows/Docker Desktop
    # hosts. The container's internal port stays 8080.
    ports: ["8000:8080"]
    # Whisper downloads its model weights on first use (~140MB for "base")
    # rather than at build time - without this volume, recreating the
    # container (a rebuild, `up --build`, etc.) would silently re-download
    # it every time.
    volumes:
      - whisper-cache:/home/polyglot/.cache/whisper
      # Where POLYGLOT_HISTORY_FILE=/data/history.jsonl keeps the caption history across restarts.
      - ui-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s
    depends_on:
      worker-en-1:
        condition: service_started
      worker-en-2:
        condition: service_started
      worker-my:
        condition: service_started
      worker-id:
        condition: service_started
      worker-ms:
        condition: service_started
      worker-th:
        condition: service_started
      worker-vi:
        condition: service_started
      worker-tl:
        condition: service_started
      worker-km:
        condition: service_started
      worker-lo:
        condition: service_started

  stt:
    <<: *app
    profiles: [tools]
    command: ["python", "stt_service.py", "--stdin"]
    stdin_open: true
    restart: "no"
    depends_on: *worker-dependencies

  tests:
    <<: *app
    # The suite builds its own brokers; it must not inherit the stack's three-broker address list.
    environment:
      <<: *common-environment
      POLYGLOT_BROKER_COUNT: ""
    build:
      context: .
      target: test
    profiles: [test]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    restart: "no"

networks:
  relay:
    driver: bridge

volumes:
  whisper-cache:
  ui-data:
  broker-data:
